name: Daily Learning Research Collection

on:
  schedule:
    # 08:00 Asia/Tokyo = 23:00 UTC (previous day)
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-learning-research
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect public museum candidates
        run: python scripts/collect_learning_research.py
      - name: Generate private article drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ] && [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            python scripts/generate-learning-drafts.py
          else
            echo "Article generation skipped: required repository secrets are not configured."
          fi
      - name: Commit research files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/learning/research/
          if ! git diff --cached --quiet; then
            git commit -m 'chore(learning): collect daily public museum candidates'
            git push
          fi
