name: Daily Learning Research Collection

on:
  schedule:
    # 08:00 Asia/Tokyo = 23:00 UTC (previous day)
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: daily-learning-research
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect public museum candidates
        run: python scripts/collect_learning_research.py
      - name: Commit research files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/learning/research/
          if ! git diff --cached --quiet; then
            git commit -m 'chore(learning): collect daily public museum candidates'
            git push
          fi

      - name: Submit candidates for private Agent drafts
        continue-on-error: true
        run: python scripts/submit-learning-drafts.py
