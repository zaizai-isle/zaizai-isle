name: Deploy GH Pages
on:
  push:
    branches: [ main ]
    # Automation runbooks are not part of the public documentation routes.
    paths-ignore:
      - "docs/automation/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_PASSPORT_CLOUD_ENABLED: ${{ vars.NEXT_PUBLIC_PASSPORT_CLOUD_ENABLED }}
      NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
      # 供应商凭证（Gemini 等）一律不再进入静态构建；Banana 只走服务端代理。
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      
      - run: npm ci
      - run: npm run lint
      - run: npm run test:banana-ai
      - run: npm run test:daily-learning
      
      - run: npm run build
      - run: npm run audit:export
      - run: npm run verify:learning-compat
      
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
