  <line x1="64" y1="1855" x2="1016" y2="1855" stroke="#282828" stroke-opacity=".28" stroke-width="2" />
  <text x="64" y="1890" class="mono" fill="#707070" font-size="15">ZAIZAI ISLE  /  ARRIVAL RECORD</text>
  <text x="1016" y="1890" class="mono" fill="#707070" font-size="15" text-anchor="end">NO. 0001</text>
