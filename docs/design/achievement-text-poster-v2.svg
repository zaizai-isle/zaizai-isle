  <text x="64" y="1800" class="mono" fill="#707070" font-size="16">ARRIVAL DATE</text>
  <text x="1016" y="1800" class="mono" fill="#707070" font-size="16" text-anchor="end">LOCATION</text>
  <text x="64" y="1832" class="mono" fill="#303030" font-size="21" font-weight="700">2026.08.26</text>
